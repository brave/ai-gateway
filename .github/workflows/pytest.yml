name: Run Pytest with Docker Compose

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build ai-gateway Docker image
        run: docker build --target test-builder -t ai-gateway-test .

      - name: Run Docker Compose
        run: |
          docker compose -f docker-compose.test.yml up --exit-code-from ai-gateway --abort-on-container-exit

      - name: Clean up
        if: always()
        run: docker compose -f docker-compose.test.yml down
