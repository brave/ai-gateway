name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Ruff (Python)
        run: pipx run ruff==0.16.7 check .

      - name: ShellCheck
        run: git ls-files -z '*.sh' | xargs -0 shellcheck

      - name: actionlint (GitHub Actions)
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" -o actionlint.tar.gz
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum --check --status -
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color

      - name: Prettier (Markdown/YAML/JSON)
        run: npx prettier@3 --check '**/*.md' '**/*.yml' '**/*.yaml' '**/*.json'
