[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[project]
name = "ai-gateway"
version = "1.0.1"
description = "Backend for Brave's AI Chat"
readme = "README.md"
requires-python = ">=3.12,<3.15"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Framework :: FastAPI",
  "Framework :: Pydantic :: 2",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
]
license = "MPL-2.0 AND Apache-2.0"
license-files = ["LICENSE"]
dynamic = ["dependencies"]

[project.urls]
"Homepage" = "https://github.com/brave/ai-gateway"

[tool.poetry]
packages = [{ include = "aichat" }]

[tool.poetry.dependencies]
aiobotocore = "3.8.0"
anthropic = "0.117.0"
blake3 = "1.0.9"
boto3 = "1.43.46"
fastapi = "0.139.2"
httpx = "0.28.1"
litellm = "1.93.0"
aws-bedrock-token-generator = "1.1.0"
numpy = "2.4.6"
openai = "2.46.0"
prometheus-fastapi-instrumentator = "8.0.2"
pyahocorasick = "2.3.1"
pypdf = "6.16.1"
cryptography = ">=50.0.0"
pydantic = "2.13.4"
pydantic-settings = "2.14.2"
python-multipart = "0.0.32"
redis = "8.0.1"
sentry-sdk = "2.66.1"
shortuuid = "1.0.13"
tiktoken = "0.13.0"
urllib3 = "2.7.0"
uvicorn = "0.51.0"
mcp = "^1.28.1"

[tool.poetry.group.dev.dependencies]
black = "26.5.1"
pylint = "4.0.8"

[tool.poetry.group.test.dependencies]
aioresponses = "0.7.9"
coverage = "7.15.4"
pytest = "9.1.1"
pytest-asyncio = "1.4.0"
pytest_httpx = "0.36.2"
requests = "2.34.2"
syrupy = "5.5.3"
time-machine = "3.2.0"
pytest-bdd = "8.1.0"
mako = "<1.4.3"

[tool.pytest.ini_options]
cache_dir = "/tmp/pytest_cache"
